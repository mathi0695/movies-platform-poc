name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Step1
        run: echo "Hello World"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ec2-3-111-58-191.ap-south-1.compute.amazonaws.com
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/movies-platform-poc
            git pull origin main
            docker compose up -d --build